[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "aiotasks"
version = "2.0.0"
description = "A Celery-like task manager that distributes Asyncio coroutines"
readme = "README.rst"
requires-python = ">=3.12"
keywords = [ "asyncio", "celery", "tasks", "queue", "distributed", "redis", "rabbitmq", "zeromq",]
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Console", "Intended Audience :: Developers", "License :: OSI Approved :: BSD License", "Operating System :: MacOS", "Operating System :: Microsoft :: Windows", "Operating System :: POSIX", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: System :: Distributed Computing", "Framework :: AsyncIO",]
dependencies = [ "click>=8.1.7", "colorlog>=6.8.0", "pydantic>=2.5.0", "msgpack>=1.0.7", "tenacity>=8.2.3", "uvloop>=0.19.0", "ujson>=5.9.0", "redis[hiredis]>=5.0.0", "aio-pika>=9.4.0", "pyzmq>=25.1.0", "fastapi>=0.109.0", "uvicorn[standard]>=0.27.0",]
[[project.authors]]
name = "Daniel Alfocea (cr0hn)"
email = "daniel@danielalfocea.com"

[project.license]
text = "BSD-3-Clause"

[project.optional-dependencies]
monitoring = [ "prometheus_client>=0.19.0",]
dashboard = [ "prometheus_client>=0.19.0",]
all = [ "prometheus_client>=0.19.0",]
dev = [ "pytest>=7.4.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.1.0", "pytest-timeout>=2.2.0", "pytest-mock>=3.12.0", "ruff>=0.2.0", "pylint>=3.0.0", "mypy>=1.8.0", "pre-commit>=3.6.0", "types-redis>=4.6.0", "fakeredis[lua]>=2.21.0", "prometheus_client>=0.19.0", "redislite>=6.2.0",]
docs = [ "mkdocs>=1.5.0", "mkdocs-material>=9.5.0", "mkdocstrings[python]>=0.24.0", "mkdocs-static-i18n>=1.2.0",]

[project.scripts]
aiotasks = "aiotasks.cli:main"
aiotasks-worker = "aiotasks.cli:main"

[project.urls]
Homepage = "https://github.com/cr0hn/aiotasks"
Documentation = "https://aiotasks.readthedocs.io"
Repository = "https://github.com/cr0hn/aiotasks"
Issues = "https://github.com/cr0hn/aiotasks/issues"
Changelog = "https://github.com/cr0hn/aiotasks/blob/master/CHANGELOG.md"

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
pretty = true
[[tool.mypy.overrides]]
module = [ "msgpack.*", "colorlog.*", "aio_pika.*", "zmq.*",]
ignore_missing_imports = true

[tool.ruff.lint]
select = [ "E", "W", "F", "I", "C", "B", "UP", "ASYNC", "S", "T20", "PT", "RET", "SIM", "TCH", "ARG", "PTH", "ERA", "PL", "PERF", "RUF",]
ignore = [ "E501", "S101", "PLR0913", "PLR2004",]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [ "tests",]
asyncio_mode = "auto"
addopts = [ "-ra", "--strict-markers", "--strict-config", "--showlocals",]
markers = [ "slow: marks tests as slow (deselect with '-m \"not slow\"')", "integration: marks tests as integration tests", "redis: marks tests that require Redis", "rabbitmq: marks tests that require RabbitMQ", "zeromq: marks tests that require ZeroMQ",]
filterwarnings = [ "error", "ignore::DeprecationWarning",]

[tool.coverage.run]
source = [ "aiotasks",]
branch = true
parallel = true
omit = [ "*/tests/*", "*/examples/*",]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [ "pragma: no cover", "def __repr__", "if TYPE_CHECKING:", "raise AssertionError", "raise NotImplementedError", "if __name__ == .__main__.:", "@abstractmethod", "@abc.abstractmethod",]

[tool.pylint.main]
py-version = "3.12"
jobs = 0
suggestion-mode = true

[tool.pylint.messages_control]
disable = [ "C0111", "C0103", "R0903", "R0801", "W0212",]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 7
max-attributes = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [ "S101", "ARG", "PLR2004",]
"examples/**/*.py" = [ "T20",]

[tool.hatch.build.targets.wheel]
packages = [ "aiotasks",]
