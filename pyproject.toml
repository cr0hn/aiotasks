[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiotasks"
version = "2.0.0"
description = "A Celery-like task manager that distributes Asyncio coroutines"
authors = [
    { name = "Daniel Garcia (cr0hn)", email = "cr0hn@cr0hn.com" }
]
readme = "README.rst"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
keywords = ["asyncio", "celery", "tasks", "queue", "distributed", "redis", "rabbitmq", "zeromq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Framework :: AsyncIO",
]

dependencies = [
    "click>=8.1.7",
    "colorlog>=6.8.0",
    "pydantic>=2.5.0",
    "msgpack>=1.0.7",
    "tenacity>=8.2.3",
    "uvloop>=0.19.0",  # Performance improvement by default
]

[project.optional-dependencies]
redis = [
    "redis[hiredis]>=5.0.0",
]
amqp = [
    "aio-pika>=9.4.0",
]
zeromq = [
    "pyzmq>=25.1.0",
]
fastapi = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]
performance = [
    "ujson>=5.9.0",
]
all = [
    "aiotasks[redis,amqp,zeromq,fastapi,performance]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.2.0",
    "pylint>=3.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "types-redis>=4.6.0",
    "fakeredis[lua]>=2.21.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-static-i18n>=1.2.0",
]

[project.scripts]
aiotasks = "aiotasks.cli:main"
aiotasks-worker = "aiotasks.cli:main"

[project.urls]
Homepage = "https://github.com/cr0hn/aiotasks"
Documentation = "https://aiotasks.readthedocs.io"
Repository = "https://github.com/cr0hn/aiotasks"
Issues = "https://github.com/cr0hn/aiotasks/issues"
Changelog = "https://github.com/cr0hn/aiotasks/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["aiotasks"]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
    "PERF",   # perflint
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (pytest uses asserts)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # assert allowed in tests
    "ARG",    # unused arguments (fixtures)
    "PLR2004", # magic values in tests
]
"examples/**/*.py" = [
    "T20",    # print allowed in examples
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "msgpack.*",
    "colorlog.*",
    "aio_pika.*",
    "zmq.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--cov=aiotasks",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "redis: marks tests that require Redis",
    "rabbitmq: marks tests that require RabbitMQ",
    "zeromq: marks tests that require ZeroMQ",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["aiotasks"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/examples/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.pylint.main]
py-version = "3.11"
jobs = 0
suggestion-mode = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
    "R0801",  # duplicate-code
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 7
max-attributes = 10
